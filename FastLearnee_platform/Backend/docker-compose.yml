services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fastlearnee:fastlearnee@db:5432/fastlearnee
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - material_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastlearnee
      POSTGRES_USER: fastlearnee
      POSTGRES_PASSWORD: fastlearnee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastlearnee -d fastlearnee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  material_storage:
  postgres_data:
